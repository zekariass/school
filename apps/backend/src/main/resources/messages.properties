# Server-side messages (English, default). Keys: error.<code> for problem details,
# error.title.<status> for titles. Keep messages_am.properties in sync (enforced by MessagesTest).
error.title.400=Bad request
error.title.401=Sign-in required
error.title.403=Not allowed
error.title.404=Not found
error.title.405=Method not allowed
error.title.409=Conflict
error.title.415=Unsupported media type
error.title.500=Server error

error.bad_request=The request could not be processed.
error.unauthorized=Please sign in to continue.
error.forbidden=You don't have permission to do this.
error.not_found=We couldn't find what you were looking for.
error.method_not_allowed=This action isn't supported here.
error.unsupported_media_type=This content type isn't supported.
error.validation_failed=Some fields need your attention.
error.invalid_cursor=The page link is no longer valid. Please reload the list.
error.internal_error=Something went wrong on our side. Please try again.

# Reference data
# Messages that take arguments are run through MessageFormat: avoid apostrophes in them.
error.reference.invalid_level=The level must be between 1 and 5.
error.country.not_found=We couldn't find that country.
error.country.unknown=The country isn't recognised.
error.country.not_enabled=This country isn't enabled yet. Schools can only be created in enabled countries.
error.language.unknown=The language isn't recognised or isn't enabled.
error.currency.unknown=The currency isn't recognised.
error.calendar.unknown=The calendar isn't recognised.
error.timezone.invalid=The timezone isn't valid.

# Tenancy
error.organization.not_found=We couldn't find that organization.
error.organization.unknown=The organization isn't recognised.
error.organization.country_mismatch=The organization belongs to a different country than the school.
error.organization.slug_taken=This organization identifier is already taken.
error.school.not_found=We couldn't find that school.
error.school.slug_taken=This school identifier is already taken.
error.school.default_language_not_in_country=The default language must be one of the country's languages.
error.school.language_not_in_country=Some of the chosen languages aren't supported in this country.
error.school.invalid_status_transition=The school can't change to that status.
error.campus.not_found=We couldn't find that campus.
error.campus.code_taken=This campus code is already used in this school.

# Settings and features
error.setting.unknown_key=This setting isn't recognised.
error.setting.scope_not_allowed=This setting cannot be set at the {0} level.
error.setting.invalid_value=This value is not valid for this setting: {0}
error.feature.unknown_key=This feature isn't recognised.
error.feature.invalid_config=A feature's configuration must be a JSON object.
error.scope.invalid=The scope isn't valid: set only the key that matches its type.
error.config.override_not_found=Nothing is set at this level.
error.config.concurrent_update=Someone else changed this at the same time. Please try again.

# Subscriptions
error.subscription.plan_not_found=We couldn't find that plan.
error.subscription.plan_not_applicable=This plan isn't available for schools.
error.subscription.invalid_status=The status must be TRIALING or ACTIVE.
error.subscription.invalid_period=The end of the period must be in the future.
