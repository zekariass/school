spring:
  application:
    name: school-backend
  autoconfigure:
    # No username/password login exists; avoids Boot's generated default user.
    # Token authentication (JWT resource server) replaces this in Implementation Plan M1.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # Connection settings come from the environment in every deployed environment.
  # For local development use the "local" profile (application-local.yaml),
  # which points at infra/docker-compose.yml.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema (docs/Database_Design.md)
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false   # event_publication is created by Flyway (V0_02)
      republish-outstanding-events-on-restart: false  # EventPublicationMaintenance resubmits

school:
  i18n:
    supported-locales: en,am
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    public-api-docs: false
    public-metrics: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/**
  override-with-generic-response: false
  default-produces-media-type: application/json
  writer-with-order-by-keys: true   # deterministic snapshot (OpenApiSpecTest)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  # Traces are exported over OTLP only when an endpoint is configured, e.g.
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://collector:4318/v1/traces
  otlp:
    metrics:
      export:
        # Metrics are scraped from /actuator/prometheus; OTLP push is opt-in
        # (otherwise it pushes to localhost:4318 by default).
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}

logging:
  # Request id and trace ids on every log line. Deployed environments switch to JSON
  # with LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs.
  pattern:
    correlation: "[%X{requestId:-},%X{traceId:-},%X{spanId:-}] "
