spring:
  application:
    name: school-backend
  profiles:
    group:
      # "staging" and "prod" share application-deployed.yaml. At startup DeploymentConfigPostProcessor
      # fails them with one message listing every missing or unsafe setting (system.startup).
      staging: deployed
      prod: deployed
  autoconfigure:
    # Authentication is by bearer token only (identity module); no generated default user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # Connection settings come from the environment in every deployed environment.
  # For local development use the "local" profile (application-local.yaml),
  # which points at infra/docker-compose.yml.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # Redis: configuration cache, rate limits and WebSocket fan-out.
  # Deployed environments set REDIS_URL (redis://host:6379); the "local" profile points at
  # infra/docker-compose.yml. The empty default must stay empty: a literal "${REDIS_URL}"
  # would fail URL parsing even when tests supply the connection through Testcontainers.
  # An empty value would make Spring fall back to localhost:6379, so DeploymentConfigValidator refuses to
  # start in every profile except local and test.
  data:
    redis:
      url: ${REDIS_URL:}
      repositories:
        enabled: false   # Redis is a cache here, not a Spring Data repository store
  cache:
    type: redis
    # role-grants and auth-users have their own TTLs (authorization / identity modules).
    cache-names: school-configuration,role-grants,auth-users
    redis:
      # Safety net only; writes evict explicitly (tenancy.application.ConfigurationCacheEvictor).
      time-to-live: 5m
  jackson:
    # Absent instead of null: matches the optional properties of the generated TypeScript types.
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema (docs/Database_Design.md)
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false   # event_publication is created by Flyway (V0_02)
      republish-outstanding-events-on-restart: false  # EventPublicationMaintenance resubmits

school:
  # school.i18n.supported-locales (optional) restricts the message languages detected from messages_*.properties
  migrations:
    # migrate: Flyway applies pending migrations at startup (local, tests). validate: the application only checks
    # that the schema is fully migrated and fails otherwise; staging/prod use it and run `--migrate` once per
    # deploy before the new version starts (system.startup.DatabaseMigrator, docs/ops/Runbook.md).
    mode: migrate
  auth:
    jwt:
      issuer: ${SCHOOL_AUTH_JWT_ISSUER:school-api}
      audience: ${SCHOOL_AUTH_JWT_AUDIENCE:school-apps}
      # JWK Set ({"keys":[...]}) of EC P-256 keys with private parts; the first signs.
      # Required: no default, startup fails without it (generate: npm run jwk:generate -w school-backend).
      keys: ${SCHOOL_AUTH_JWT_KEYS}
    otp:
      # HMAC key of stored one-time-code hashes, >= 32 characters. Required, no default.
      pepper: ${SCHOOL_AUTH_OTP_PEPPER}
  sms:
    # Only "console" exists so far (log output); refused outside local/test unless allow-console.
    provider: ${SCHOOL_SMS_PROVIDER:}
    allow-console: ${SCHOOL_SMS_ALLOW_CONSOLE:false}
  mail:
    from: ${SCHOOL_MAIL_FROM:School <no-reply@school.local>}
  push:
    # expo | log. Required, no default: a deploy without it fails at startup. "log" only writes a masked line
    # per push and is refused outside local/test unless allow-log. EXPO_ACCESS_TOKEN is optional.
    provider: ${SCHOOL_PUSH_PROVIDER:}
    allow-log: ${SCHOOL_PUSH_ALLOW_LOG:false}
    expo:
      access-token: ${EXPO_ACCESS_TOKEN:}
  guardians:
    # Web app origin used in guardian invitation links ({base}/{locale}/invite/{token}). Required, no default:
    # a deploy without it fails at startup.
    invite-base-url: ${SCHOOL_GUARDIANS_INVITE_BASE_URL:}
  bootstrap:
    admin:
      # First platform administrator, created at startup when none exists (see README).
      phone: ${SCHOOL_BOOTSTRAP_ADMIN_PHONE:}
      email: ${SCHOOL_BOOTSTRAP_ADMIN_EMAIL:}
      name: ${SCHOOL_BOOTSTRAP_ADMIN_NAME:Platform administrator}
  safeguarding:
    encryption:
      # AES-256 keys of the narrative and notes of safeguarding incidents (docs/ops/Runbook.md, section 6). The keys are a
      # map: SCHOOL_SAFEGUARDING_ENCRYPTION_KEYS_K1=<base64 of 32 random bytes>, ..._K2, ... (key ids are lower case);
      # the ACTIVE one encrypts new text, every listed one still decrypts. No defaults: the deployed profiles refuse to
      # start without a valid key, the development key lives in application-local.yaml only.
      active-key-id: ${SCHOOL_SAFEGUARDING_ENCRYPTION_ACTIVE_KEY_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  storage:
    # S3-compatible object storage (Cloudflare R2 deployed, SeaweedFS locally). Required, no defaults:
    # a deploy without them fails at startup. SCHOOL_STORAGE_PUBLIC_ENDPOINT (optional) is the host clients
    # use in presigned URLs; it defaults to the endpoint (set it when the backend reaches the store on a
    # private address).
    endpoint: ${SCHOOL_STORAGE_ENDPOINT}
    region: ${SCHOOL_STORAGE_REGION:auto}       # R2 uses "auto"
    bucket: ${SCHOOL_STORAGE_BUCKET}
    access-key: ${SCHOOL_STORAGE_ACCESS_KEY}
    secret-key: ${SCHOOL_STORAGE_SECRET_KEY}
  security:
    public-api-docs: false
    public-metrics: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/**
  override-with-generic-response: false
  default-produces-media-type: application/json
  writer-with-order-by-keys: true   # deterministic snapshot (OpenApiSpecTest)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Public (no authentication) and status only: never component details.
      show-details: never
      show-components: never
      group:
        # Liveness: the process is up (a failing dependency must not restart the container).
        liveness:
          include: livenessState
        # Readiness: ready for traffic only with the database and Redis reachable.
        readiness:
          include: readinessState,db,redis
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  # Traces are exported over OTLP only when an endpoint is configured, e.g.
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://collector:4318/v1/traces
  otlp:
    metrics:
      export:
        # Metrics are scraped from /actuator/prometheus; OTLP push is opt-in
        # (otherwise it pushes to localhost:4318 by default).
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}

# Error tracking (Sentry or a compatible server such as GlitchTip): off unless SENTRY_DSN is set. Request data, users,
# breadcrumbs and personal data never leave the process (system.observability.SentryScrubber).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:}
  release: ${SCHOOL_BUILD_COMMIT:unknown}
  send-default-pii: false
  max-request-body-size: none
  attach-server-name: false
  traces-sample-rate: 0.0
  in-app-includes: com.nemaz.school

# Returned by GET /actuator/info together with the build (version, time). The commit comes from the image build
# (Dockerfile ARG GIT_SHA); deploy smoke tests compare it with the commit that was deployed.
info:
  app:
    name: school-backend
    commit: ${SCHOOL_BUILD_COMMIT:unknown}

logging:
  # Request id and trace ids on every log line. Deployed environments switch to JSON
  # with LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs.
  pattern:
    correlation: "[%X{requestId:-},%X{traceId:-},%X{spanId:-}] "
