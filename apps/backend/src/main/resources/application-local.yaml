# Local development profile, matching infra/docker-compose.yml.
# Dev-only credentials; never use this profile in a deployed environment.
# Ports are non-default so the stack runs next to other local projects:
# API 8180, web 3100, Expo/Metro 8081.
server:
  port: 8180

spring:
  datasource:
    url: jdbc:postgresql://localhost:5442/school
    username: school
    password: school
  data:
    redis:
      url: redis://localhost:6390
  mail:
    host: localhost
    port: 1035   # Mailpit (UI on http://localhost:8035)

school:
  cors:
    allowed-origins: http://localhost:3100,http://localhost:8081
  auth:
    jwt:
      keys: ""                    # no key: an ephemeral one is generated (tokens end with the process)
      allow-ephemeral-key: true
    otp:
      pepper: local-development-pepper-not-a-secret-0123456789
  storage:
    # SeaweedFS from infra/docker-compose.yml. A phone on Wi-Fi cannot reach "localhost": start the
    # backend with SCHOOL_STORAGE_PUBLIC_ENDPOINT=http://<LAN IP>:8343 for physical-device uploads.
    endpoint: http://localhost:8343
    public-endpoint: ${SCHOOL_STORAGE_PUBLIC_ENDPOINT:http://localhost:8343}
    region: us-east-1
    bucket: school-media-dev
    access-key: school-dev
    secret-key: school-dev-secret
    create-bucket: true
    cors-origins: http://localhost:3100
  safeguarding:
    encryption:
      # DEVELOPMENT KEY, not a secret: it is in the repository, so a deployed profile refuses it (DeploymentConfigValidator).
      active-key-id: dev
      keys:
        dev: ZpMvTuBbu45fW1DPsfAjLbkM70qGZACjbSFvt31V1WE=
  sms:
    provider: console             # one-time codes are printed in the backend log
  guardians:
    invite-base-url: ${SCHOOL_GUARDIANS_INVITE_BASE_URL:http://localhost:3100}
  push:
    provider: ${SCHOOL_PUSH_PROVIDER:log}   # "log" prints pushes; SCHOOL_PUSH_PROVIDER=expo sends real ones
  bootstrap:
    admin:
      phone: "+251900000001"      # sign in locally with this phone; the code is in the log
      name: Dev Admin
  security:
    public-api-docs: true
    public-metrics: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
