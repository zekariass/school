name: Images

# Container images for the backend and the web app.
#   - pull_request: build both images (no push) to catch Dockerfile breakage.
#   - push to main / v*.*.*: build and publish to GHCR.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".dockerignore"
      - ".github/workflows/images.yml"

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }} (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: apps/backend
            dockerfile: apps/backend/Dockerfile
            build_args: GIT_SHA=${{ github.sha }}
          - image: web
            context: .
            dockerfile: apps/web/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: false
          provenance: false
          cache-from: type=gha,scope=school-${{ matrix.image }}
          cache-to: type=gha,scope=school-${{ matrix.image }},mode=max

  publish:
    name: Publish ${{ matrix.image }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: apps/backend
            dockerfile: apps/backend/Dockerfile
            build_args: GIT_SHA=${{ github.sha }}
          - image: web
            context: .
            dockerfile: apps/web/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v7

      # GHCR repository names must be lowercase.
      - name: Compute image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE_NAME=ghcr.io/${OWNER,,}/school-${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=school-${{ matrix.image }}
          cache-to: type=gha,scope=school-${{ matrix.image }},mode=max
