# Local development infrastructure for the School platform.
#
#   docker compose -f infra/docker-compose.yml up -d      (or: npm run infra:up)
#
# Host ports are deliberately non-default so this stack can run next to other
# local projects (5432/6379/1025/8025/8333 are commonly taken).
#
#   Service     Host port        Purpose
#   postgres    5442             PostgreSQL 18 (DB "school", user/pass "school")
#   redis       6390             Cache, rate limits, pub/sub fan-out
#   s3          8343             SeaweedFS S3 API: local stand-in for Cloudflare R2 (bucket school-media-dev is
#                                created by the backend's local profile, with CORS for the web app)
#   mailpit     1035 / 8035      SMTP sink / web UI for dev emails
#
# Dev-only credentials. Never reuse them outside local development.

name: school

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: school
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6390:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.52
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    ports:
      # Loopback only. A phone on Wi-Fi uploads straight to this port: start the stack with
      # S3_BIND_ADDRESS=0.0.0.0 (and the backend with SCHOOL_STORAGE_PUBLIC_ENDPOINT=http://<LAN IP>:8343).
      - "${S3_BIND_ADDRESS:-127.0.0.1}:8343:8333"
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:1035:1025"
      - "127.0.0.1:8035:8025"

volumes:
  pgdata:
  redisdata:
  s3data:
