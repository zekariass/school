# Production-shaped deployment of the School platform on ONE Docker host (a single VM).
# Provider-agnostic: any Linux VM with Docker Engine + Compose v2 works. Operate it with ./deploy.sh
# (docs/ops/Runbook.md); do not edit this file on the server.
#
#   backend   Spring Boot API (image from GHCR), non-root, read-only filesystem
#   web       Next.js standalone server (image from GHCR), non-root, read-only filesystem
#   migrate   one-shot job: the backend image with --migrate (Flyway), run before every roll-out
#   proxy     Caddy: routes the web and API hostnames. It terminates nothing Cloudflare already
#             terminates: with the tunnel profile it speaks plain HTTP inside the Docker network
#   tunnel    (profile "tunnel") cloudflared: outbound-only connection to Cloudflare, no inbound ports
#   postgres  (profile "local-db")   PostgreSQL 18 on the same host, for single-VM staging/pilot
#   redis     (profile "local-redis") Redis 7.4 on the same host
#
# Typical single-VM profile set:  COMPOSE_PROFILES=local-db,local-redis,tunnel   (see .env.example)
# With managed Postgres/Redis drop the local-* profiles and point DB_URL/REDIS_URL at them.
#
# Every setting comes from .env (secrets: see .env.example) and .deploy/images.env (written by deploy.sh).

name: school

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging

services:
  backend:
    <<: *hardened
    image: ${BACKEND_IMAGE_REF:?run ./deploy.sh (it sets BACKEND_IMAGE_REF)}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: ${SCHOOL_PROFILE:-staging}
      SCHOOL_ENVIRONMENT: ${SCHOOL_PROFILE:-staging}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_URL: ${REDIS_URL:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
      SCHOOL_AUTH_JWT_KEYS: ${SCHOOL_AUTH_JWT_KEYS:?}
      SCHOOL_AUTH_OTP_PEPPER: ${SCHOOL_AUTH_OTP_PEPPER:?}
      SCHOOL_AUTH_JWT_ISSUER: ${SCHOOL_AUTH_JWT_ISSUER:-school-api}
      SCHOOL_AUTH_JWT_AUDIENCE: ${SCHOOL_AUTH_JWT_AUDIENCE:-school-apps}
      SCHOOL_SMS_PROVIDER: ${SCHOOL_SMS_PROVIDER:-}
      SCHOOL_SMS_ALLOW_CONSOLE: ${SCHOOL_SMS_ALLOW_CONSOLE:-false}
      SCHOOL_PUSH_PROVIDER: ${SCHOOL_PUSH_PROVIDER:-}
      SCHOOL_PUSH_ALLOW_LOG: ${SCHOOL_PUSH_ALLOW_LOG:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      SCHOOL_GUARDIANS_INVITE_BASE_URL: ${SCHOOL_GUARDIANS_INVITE_BASE_URL:?}
      SCHOOL_MAIL_FROM: ${SCHOOL_MAIL_FROM:-School <no-reply@school.local>}
      # Optional settings below are passed through ONLY when set in .env (a null value): Spring treats an empty
      # environment variable as a configured empty value, which breaks mail, OTLP and similar auto-configuration.
      SPRING_MAIL_HOST:
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME:
      SPRING_MAIL_PASSWORD:
      SCHOOL_BOOTSTRAP_ADMIN_PHONE: ${SCHOOL_BOOTSTRAP_ADMIN_PHONE:-}
      SCHOOL_BOOTSTRAP_ADMIN_EMAIL: ${SCHOOL_BOOTSTRAP_ADMIN_EMAIL:-}
      SCHOOL_BOOTSTRAP_ADMIN_NAME: ${SCHOOL_BOOTSTRAP_ADMIN_NAME:-Platform administrator}
      SCHOOL_STORAGE_ENDPOINT: ${SCHOOL_STORAGE_ENDPOINT:?}
      SCHOOL_STORAGE_PUBLIC_ENDPOINT: ${SCHOOL_STORAGE_PUBLIC_ENDPOINT:-${SCHOOL_STORAGE_ENDPOINT}}
      SCHOOL_STORAGE_REGION: ${SCHOOL_STORAGE_REGION:-auto}
      SCHOOL_STORAGE_BUCKET: ${SCHOOL_STORAGE_BUCKET:?}
      SCHOOL_STORAGE_ACCESS_KEY: ${SCHOOL_STORAGE_ACCESS_KEY:?}
      SCHOOL_STORAGE_SECRET_KEY: ${SCHOOL_STORAGE_SECRET_KEY:?}
      # Behind the proxy (and Cloudflare): rate limits and audit use the real client address.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      API_DOCS_ENABLED: "false"
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:
      OTLP_METRICS_EXPORT_ENABLED: ${OTLP_METRICS_EXPORT_ENABLED:-false}
      SENTRY_DSN:
      SENTRY_ENVIRONMENT: ${SCHOOL_PROFILE:-staging}
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTIONS:--XX:MaxRAMPercentage=70}
    healthcheck:
      # Readiness = database and Redis reachable. start_period covers JVM start and Flyway validation.
      # The JRE image has neither curl nor wget: plain HTTP over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPUS:-2.0}
          memory: ${BACKEND_MEMORY:-1536m}
    networks: [internal]
    depends_on:
      # Only present when the local-db / local-redis profiles are on (managed services need no wait).
      postgres: {condition: service_healthy, required: false}
      redis: {condition: service_healthy, required: false}

  web:
    <<: *hardened
    image: ${WEB_IMAGE_REF:?run ./deploy.sh (it sets WEB_IMAGE_REF)}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Next.js writes its runtime cache here; node (uid 1000) owns it.
      - /app/apps/web/.next/cache:size=256m,uid=1000,gid=1000,mode=0755
    environment:
      NODE_ENV: production
      # Server-only: where the BFF reaches the API (the Docker network name, never public).
      API_ORIGIN: http://backend:8080
      # Public origin of the web app: mutating BFF requests must come from it (Origin check).
      APP_ORIGIN: ${APP_ORIGIN:?}
      UPLOAD_PROXY_ORIGINS:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/en/sign-in',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: ${WEB_CPUS:-1.0}
          memory: ${WEB_MEMORY:-512m}
    networks: [internal]
    depends_on:
      backend: {condition: service_healthy}

  # One-shot: applies Flyway migrations and exits (0 ok, 1 failed, 2 bad configuration). Not started by "up".
  migrate:
    image: ${BACKEND_IMAGE_REF:?}
    profiles: ["migrate"]
    command: ["--migrate"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    networks: [internal]

  proxy:
    <<: *hardened
    image: caddy:2.10-alpine
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Cloudflare Origin CA certificate for Caddyfile.origin-tls (optional, see the runbook).
      - ./certs:/certs:ro
    environment:
      APP_HOST: ${APP_HOST:?}
      API_HOST: ${API_HOST:?}
    ports:
      # Plain HTTP for the tunnel/local checks; with Caddyfile.origin-tls Cloudflare connects to 443.
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_HTTP_PORT:-8080}:80"
      - "${PROXY_BIND_TLS:-127.0.0.1}:${PROXY_HTTPS_PORT:-8443}:443"
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    networks: [internal]
    depends_on:
      web: {condition: service_healthy}
      backend: {condition: service_healthy}

  tunnel:
    <<: *hardened
    image: cloudflare/cloudflared:2026.3.0
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Token of a remotely-managed tunnel (Zero Trust dashboard). Secret. Required when the tunnel profile is on.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    networks: [internal]
    depends_on:
      proxy: {condition: service_healthy}

  postgres:
    image: postgres:18
    profiles: ["local-db"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPUS:-2.0}
          memory: ${POSTGRES_MEMORY:-2g}
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    profiles: ["local-redis"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    # Cache, rate limits and pub/sub: losing it is not data loss, but keep AOF so rate-limit windows survive restarts.
    command: ["sh", "-c", "[ -n \"$$REDIS_PASSWORD\" ] || { echo 'REDIS_PASSWORD must be set' >&2; exit 1; }; exec redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy volatile-lru --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
    networks: [internal]

networks:
  internal:
    name: school-internal

volumes:
  caddy-data:
  caddy-config:
  pgdata:
  redisdata:
